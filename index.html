<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusRoom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- NAVBAR -->
    <nav class="navbar">
        <h1 class="logo-text">
            Focus<span class="highlight">Room</span>
        </h1>

        <div class="nav-links">
            <a href="#">Tasks</a>
            <a href="#">Stats</a>
            <a href="#" id="mode-toggle">Dark Mode</a>
            <a href="#">Settings</a>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>
            Stay Focused.
            <span class="focus-text">Get Things Done.</span>
        </h1>
        <p>Boost your productivity with Pomodoro timer and task manager.</p>
    </section>

    <!-- TIMER -->
    <section class="timer-card">
        <div id="time-display">25:00</div>

        <div class="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>

        <div id="session-count">Sessions: 0</div>
    </section>
    <section>
        
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
